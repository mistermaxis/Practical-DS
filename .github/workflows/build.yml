name: CMake build and test

on:
  push:
  pull_request:


jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake --preset release

    - name: Build
      run: cmake --build --preset release --parallel
