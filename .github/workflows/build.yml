name: CMake build and test

on:
  workflow_call

jobs:
  build:
    name: Build
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          name: Linux
          filepath: build/release/dsa_app/
          filename: dsa_app
          ext: -linux.x86_64
        - os: windows-latest
          name: Windows
          filepath: build/release/dsa_app/
          filename: dsa_app
          ext: -windows.exe
        - os: macos-latest
          name: MacOS
          filepath: build/release/dsa_app/
          filename: dsa_app
          ext: -macos.arm64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7
    - name: Configure
      run: cmake --preset release
    - name: Build
      run: |
        cmake --build --preset release --parallel
        if [ ${{ runner.os == 'Windows' }} ]; then
          ren ${{ matrix.filepath }}${{ matrix.filename }}.exe `
          ${{ matrix.filename }}${{ matrix.ext }}
        else
          mv ${{ matrix.filepath }}${{ matrix.filename }} \
          ${{ matrix.filepath }}${{ matrix.filename }}${{ matrix.ext }}
        fi
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: ${{ matrix.filepath }}${{ matrix.filename }}${{ matrix.ext }}
