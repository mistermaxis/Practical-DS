name: CMake build and test

on:
  push:
  pull_request:


jobs:
  build:
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          name: Linux
          filepath: build/dsa_app/dsa_app
        - os: windows-latest
          name: Windows
          filepath: build/dsa_app/dsa_app.exe
        - os: macos-latest
          name: MacOS
          filepath: build/dsa_app/dsa_app

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Configure
      run: cmake --preset release

    - name: Build
      run: cmake --build --preset release --parallel

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: ${{ matrix.filepath }}
