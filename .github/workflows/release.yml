name: Feature Stable
on:
  workflow_dispatch

env:
  EXPORT_NAME: practical-ds

jobs:
  build:
    name: Build Application
    uses: ./.github/workflows/build.yml
    if: startsWith(github.head_ref, 'feat')
  create-release:
    name: Create new stable feature
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Create tag from feature
      id: release_tag
      uses: mistermaxis/update-tag-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        prefix: v
        bump: minor
        suffix: ''
    - name: Download Files
      uses: actions/download-artifact@v8
      with:
        path: bin
        merge-multiple: true
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: bin/*
        tag: ${{ steps.release_tag.outputs.updated_tag }}
        name: Release ${{ steps.release_tag.outputs.updated_tag }}
        body: |
          ### Changelog:
          ${{ steps.release-tag.outputs.changelog }}
        makeLatest: true