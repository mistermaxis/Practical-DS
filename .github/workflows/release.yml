name: Release

on:
  push

permissions:
  contents: write

jobs:
  build:
    name: Build Executables
    uses: ./.github/workflows/build.yml
  create-release:
    name: Create new stable feature
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Create tag from feature
      id: release-tag
      uses: mistermaxis/update-tag-action@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        prefix: v
        bump: minor
        suffix: ''
    - name: Download Files
      uses: actions/download-artifact@v8
      with:
        path: bin
        merge-multiple: true
    - name: Add version tag to filename
      run: |
        mv bin/dsa_app-windows.exe bin/dsa_app-windows-${{ steps.release-tag.outputs.updated_tag }}.exe
        mv bin/dsa_app-linux.x86_64 bin/dsa_app-linux-${{ steps.release-tag.outputs.updated_tag }}.x86_64
        mv bin/dsa_app-macos.arm64 bin/dsa_app-macos-${{ steps.release-tag.outputs.updated_tag }}.arm64
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: bin/*
        tag: ${{ steps.release-tag.outputs.updated_tag }}
        name: Release ${{ steps.release-tag.outputs.updated_tag }}
        body: |
          ### Changelog:
          ${{ steps.release-tag.outputs.changelog }}
        makeLatest: true